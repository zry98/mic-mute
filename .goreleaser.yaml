---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: mic-mute

builds:
  - id: mic-mute
    builder: rust
    binary: mic-mute
    tool: cargo
    command: build
    targets:
      - aarch64-apple-darwin
    flags:
      - --release
      - --locked
    hooks:
      post:
        - cargo bundle --release --target aarch64-apple-darwin
        - mkdir -p dist-dmg
        - cp "target/aarch64-apple-darwin/release/bundle/dmg/Mic Mute.dmg" "dist-dmg/mic-mute-{{ .Version }}-aarch64-apple-darwin.dmg"

archives:
  - id: mic-mute
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Version }}-aarch64-apple-darwin"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: zry98
    name: mic-mute
  draft: false
  prerelease: auto
  extra_files:
    - glob: dist-dmg/mic-mute-*-aarch64-apple-darwin.dmg
